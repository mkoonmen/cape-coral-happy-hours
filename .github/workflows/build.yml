# Free cloud builds: on every push to main, Expo's servers build the iOS + Android apps (no Mac needed).
name: Build apps
on: { push: { branches: [main], paths: ['app/**'] }, workflow_dispatch: {} }
jobs:
  build:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: app } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - uses: expo/expo-github-action@v8
        with: { eas-version: latest, token: '${{ secrets.EXPO_TOKEN }}' }
      - run: npm install
      - run: eas build --platform all --profile production --non-interactive --no-wait --auto-submit
