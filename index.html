<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#0b1f2e"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-title" content="CC Happy Hours">
<title>Cape Coral Happy Hours</title>
<style>
body{margin:0;background:#0b1f2e;color:#fff;font:16px/1.4 -apple-system,system-ui,Roboto,sans-serif}
main{max-width:640px;margin:auto;padding:14px}h1{font-size:26px;margin:6px 0 0}.sub{color:#8fb3c9;margin-bottom:10px}
input{width:100%;box-sizing:border-box;background:#13324a;color:#fff;border:0;border-radius:10px;padding:12px;font-size:16px}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin:10px 0}.chip{border:1px solid #2b5877;border-radius:16px;padding:6px 12px;color:#8fb3c9;background:none;font-size:14px}
.chip.on{background:#ff8a3d;border-color:#ff8a3d;color:#0b1f2e;font-weight:700}
.card{background:#112a3d;border-radius:12px;padding:14px;margin:8px 0}.name{font-size:18px;font-weight:700}.meta{color:#8fb3c9}
.time{color:#ffb37a;font-weight:700;margin-top:8px}.unk{color:#6f8496;font-style:italic;margin-top:8px}.src{color:#6f8496;font-size:12px;margin-top:6px}
a{color:#4fc3f7;font-weight:600;text-decoration:none;margin-right:14px}.links{margin-top:8px}
</style></head><body><main>
<h1>Cape Coral Happy Hours</h1><div class="sub" id="sub">Loading…</div>
<input id="q" placeholder="Search restaurants, food, deals" autocomplete="off">
<div class="chips" id="chips"></div><div id="list"></div>
</main><script>
const REPORT='https://github.com/mkoonmen/cape-coral-happy-hours/issues/new';
const FILTERS=['Happy hours','All','None posted'];let filter=FILTERS[0],data={restaurants:[]};
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
function draw(){
  document.getElementById('chips').innerHTML=FILTERS.map(f=>`<button class="chip ${f===filter?'on':''}" data-f="${f}">${f}</button>`).join('');
  const q=document.getElementById('q').value.toLowerCase();
  const rows=data.restaurants.filter(r=>filter==='All'||(filter==='Happy hours'?r.happyHour.status==='listed':r.happyHour.status==='unconfirmed'))
    .filter(r=>(r.name+r.category+r.address+r.happyHour.deals).toLowerCase().includes(q));
  document.getElementById('list').innerHTML=rows.map(r=>{const h=r.happyHour;
    const t=encodeURIComponent('Happy hour update: '+r.name),b=encodeURIComponent(`Restaurant: ${r.name}\nCurrent listing: ${h.times||'none'}\nCorrect days/times:\nDeals:\nSource (menu link/photo):`);
    return `<div class="card"><div class="name">${esc(r.name)}</div><div class="meta">${esc(r.category)} · ${esc(r.address)}</div>`+
    (h.status==='listed'?`<div class="time">🍹 ${esc(h.times)}</div>${h.deals?`<div>${esc(h.deals)}</div>`:''}<div class="src">Source: ${esc(h.source)}${h.confidence==='low'?' · older or less certain':''} · confirm with the restaurant</div>`
      :`<div class="unk">${h.status==='none_expected'?'Counter-service spot — no happy hour found':'No happy hour posted online — call to ask'}</div>`)+
    `<div class="links"><a href="https://maps.google.com/?q=${encodeURIComponent(r.name+' '+r.address)}">Directions</a>${r.phone?`<a href="tel:${r.phone.replace(/\D/g,'')}">Call</a>`:''}<a href="${REPORT}?title=${t}&body=${b}">Suggest an update</a></div></div>`}).join('')||'<p class="unk">No matches.</p>';
}
document.getElementById('chips').onclick=e=>{if(e.target.dataset.f){filter=e.target.dataset.f;draw()}};
document.getElementById('q').oninput=draw;
fetch('data/restaurants.json',{cache:'no-store'}).then(r=>r.json()).then(j=>{data=j;
  const n=j.restaurants.filter(r=>r.happyHour.status==='listed').length;
  document.getElementById('sub').textContent=`${j.restaurants.length} places · ${n} happy hours · updated ${j.updated}`;draw()})
  .catch(()=>document.getElementById('sub').textContent='Could not load the list. Check your connection.');
</script></body></html>
